[package]
name = "caniclip-core"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "caniclip_core"
crate-type = ["lib", "staticlib", "cdylib"]

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"

[dependencies]
uniffi = { version = "0.32", features = ["cli"] }
gifski = { version = "1.34", default-features = false, features = ["gifsicle"] }
imgref = "1.12"
rgb = "0.8"
thiserror = "2"

[dev-dependencies]
gif = "0.14"

[profile.release]
opt-level = 3
debug = false
