[package]
name = "caniclip-core"
version = "0.1.0"
edition = "2021"
publish = false
license = "PolyForm-Noncommercial-1.0.0"
repository = "https://github.com/Flamentist/caniclip"

[lib]
name = "caniclip_core"
crate-type = ["lib", "staticlib", "cdylib"]

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"

[dependencies]
uniffi = { version = "0.32", features = ["cli"] }
# MIT OR Apache-2.0; colour quantisation via color_quant (MIT). Copyleft
# encoders (gifski, imagequant) are excluded: see tests/licences.rs.
gif = "0.14"
rgb = "0.8"
thiserror = "2"

[dev-dependencies]

[profile.release]
opt-level = 3
debug = false
