name: CaniClip
options:
  bundleIdPrefix: com.caniclip
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
configFiles:
  Debug: Local.xcconfig
  Release: Local.xcconfig
packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: 3.0.0
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: YES
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    SWIFT_INCLUDE_PATHS: "$(SRCROOT)/CaniClip/Generated"
targets:
  CaniClip:
    type: application
    platform: macOS
    sources:
      - path: CaniClip
        excludes:
          - "Generated/*.h"
          - "Generated/module.modulemap"
          - "Resources/Info.plist"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.caniclip.CaniClip
        PRODUCT_NAME: CaniClip
        INFOPLIST_FILE: CaniClip/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: CaniClip/Resources/CaniClip.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        # Link the static archive by path: with -l the linker would pick the
        # cdylib that sits beside it (built for uniffi-bindgen) and dyld would
        # then refuse to load it at runtime.
        OTHER_LDFLAGS: "$(SRCROOT)/core/target/release/libcaniclip_core.a"
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    preBuildScripts:
      - script: '"$SRCROOT/scripts/build-rust.sh"'
        name: Build Rust Core
        basedOnDependencyAnalysis: false
    dependencies:
      - package: KeyboardShortcuts
      - sdk: ScreenCaptureKit.framework
      - sdk: ServiceManagement.framework
  CaniClipTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: CaniClipTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.caniclip.CaniClipTests
    dependencies:
      - target: CaniClip
schemes:
  CaniClip:
    build:
      targets:
        CaniClip: all
        CaniClipTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - CaniClipTests
